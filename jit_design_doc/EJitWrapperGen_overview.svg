<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="#fafafa"/>

  <!-- Title -->
  <text x="800" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">EJitWrapperGen — Current Behavior</text>
  <text x="800" y="60" text-anchor="middle" font-size="13" fill="#6b7280">icache ON = LEVER B (frame-less wrapper + F_miss)  ·  icache OFF = single-function wrapper</text>

  <!-- ============ Pass overview sidebar ============ -->
  <rect x="20" y="80" width="330" height="690" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="185" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6">Pass (per module)</text>
  <line x1="40" y1="118" x2="330" y2="118" stroke="#c4b5fd" stroke-width="1"/>

  <text x="36" y="142" font-size="12" font-weight="bold" fill="#5b21b6">1. Idempotency</text>
  <text x="36" y="158" font-size="11" fill="#374151">all entries already wrapped? → return</text>

  <text x="36" y="184" font-size="12" font-weight="bold" fill="#5b21b6">2. Declare runtime API</text>
  <text x="36" y="200" font-size="11" fill="#374151">ejit_taskpool_compile_or_get[_0d..4d]</text>
  <text x="36" y="216" font-size="11" fill="#374151">ejit_taskpool_release_read  (+trace if timing)</text>

  <text x="36" y="242" font-size="12" font-weight="bold" fill="#5b21b6">3. Create globals</text>
  <text x="36" y="258" font-size="11" fill="#374151">@__ejit_funcidx_&lt;name&gt;   i32 (=invalid)</text>
  <text x="36" y="274" font-size="11" fill="#374151">@__ejit_dimtype_&lt;period&gt; i32</text>
  <text x="36" y="290" font-size="11" fill="#374151">@__ejit_icache_fn_&lt;name&gt; [D]^numDims ptr</text>
  <text x="48" y="306" font-size="10" fill="#6b7280">(icache ON, numDims≤MAX; =null)</text>

  <text x="36" y="332" font-size="12" font-weight="bold" fill="#5b21b6">4. ejit_auto_register()</text>
  <text x="36" y="348" font-size="11" fill="#374151">register funcidx / lifecycle / icache-slot</text>

  <text x="36" y="374" font-size="12" font-weight="bold" fill="#5b21b6">5. For each ejit_entry F</text>
  <text x="36" y="390" font-size="11" fill="#374151">• F.addFnAttr(NoInline)  (−ejit-noinline)</text>
  <text x="36" y="406" font-size="11" fill="#374151">• EmitIcacheProbe =</text>
  <text x="36" y="422" font-size="11" fill="#374151">    EJitInlineCache &amp;&amp; F in icache map</text>
  <text x="36" y="442" font-size="11" fill="#1e3a8a">  icache ON  → LEVER B (split F + F_miss)</text>
  <text x="36" y="458" font-size="11" fill="#374151">  icache OFF → single-function wrapper</text>

  <!-- Legend -->
  <rect x="20" y="490" width="330" height="270" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="185" y="514" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Legend</text>
  <rect x="40" y="530" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="72" y="543" font-size="11" fill="#374151">wrapper F (entry, hot path)</text>
  <rect x="40" y="556" width="22" height="16" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="72" y="569" font-size="11" fill="#374151">F_miss (slow path, framed)</text>
  <rect x="40" y="582" width="22" height="16" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="72" y="595" font-size="11" fill="#374151">cached specialization (JIT)</text>
  <rect x="40" y="608" width="22" height="16" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="72" y="621" font-size="11" fill="#374151">original body (AOT fallback)</text>
  <text x="40" y="650" font-size="11" fill="#16a34a">━ hit / ok</text>
  <text x="160" y="650" font-size="11" fill="#dc2626">━ miss / fail</text>
  <text x="40" y="676" font-size="11" font-weight="bold" fill="#7c2d12">★</text>
  <text x="58" y="676" font-size="11" fill="#374151">attrs copied from F (fix)</text>
  <text x="40" y="696" font-size="11" font-weight="bold" fill="#7c2d12">★</text>
  <text x="58" y="696" font-size="11" fill="#374151">body moved from F into F_miss</text>
  <text x="40" y="724" font-size="10" fill="#6b7280" font-style="italic">musttail → br (tail-jump, reuses frame)</text>
  <text x="40" y="740" font-size="10" fill="#6b7280" font-style="italic">frame-less = no alloca + musttail</text>

  <!-- ============ icache ON section ============ -->
  <text x="980" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">icache ON  (LEVER B)</text>
  <text x="980" y="118" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">caller</text>

  <!-- F wrapper container -->
  <rect x="620" y="128" width="720" height="214" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="980" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">F   (wrapper · noinline · frame-less)</text>

  <!-- jit_entry -->
  <rect x="640" y="162" width="680" height="80" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="980" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">jit_entry   (probe · no alloca)</text>
  <text x="660" y="198" font-size="11" fill="#374151">slot = &amp;@__ejit_icache_fn_F[d0]…[dn]   (GEP if numDims&gt;0; scalar if 0)</text>
  <text x="660" y="214" font-size="11" fill="#374151">fn  = load slot   (plain ldr · per-core private · no atomic)</text>
  <text x="660" y="230" font-size="11" fill="#374151">br expect(fn≠null,true) ? jit_icache_dispatch : jit_miss</text>

  <!-- jit_icache_dispatch -->
  <rect x="640" y="260" width="320" height="66" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="800" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">jit_icache_dispatch  (hit)</text>
  <text x="800" y="296" text-anchor="middle" font-size="11" fill="#374151">musttail call fn(args)</text>
  <text x="800" y="312" text-anchor="middle" font-size="11" fill="#374151">ret   (no release_read)</text>

  <!-- jit_miss -->
  <rect x="1000" y="260" width="320" height="66" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1160" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">jit_miss</text>
  <text x="1160" y="296" text-anchor="middle" font-size="11" fill="#374151">musttail call @F_miss(args)</text>
  <text x="1160" y="312" text-anchor="middle" font-size="11" fill="#374151">ret</text>

  <!-- arrows inside wrapper -->
  <line x1="800" y1="242" x2="800" y2="258" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="775" y="256" font-size="10" font-weight="bold" fill="#16a34a">hit</text>
  <line x1="1160" y1="242" x2="1160" y2="258" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="1170" y="256" font-size="10" font-weight="bold" fill="#dc2626">miss</text>

  <!-- annotation -->
  <text x="980" y="360" text-anchor="middle" font-size="10" font-style="italic" fill="#1e40af">frame-less = no alloca + musttail → codegen omits prologue/epilogue   (gated on !EJitWrapperTiming)</text>

  <!-- arrows from wrapper down -->
  <line x1="800" y1="326" x2="800" y2="398" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="372" font-size="10" fill="#374151">br (tail-jump, reuses frame)</text>
  <line x1="1160" y1="326" x2="1160" y2="398" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1170" y="372" font-size="10" fill="#374151">br (tail-jump)</text>

  <!-- cached spec -->
  <rect x="620" y="400" width="360" height="72" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="800" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">cached specialization (JIT)</text>
  <text x="800" y="450" text-anchor="middle" font-size="11" fill="#14532d">hit → execute directly</text>

  <!-- F_miss container -->
  <rect x="1010" y="400" width="560" height="402" rx="12" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
  <text x="1290" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">F_miss   (internal · noinline · framed)</text>
  <text x="1290" y="438" text-anchor="middle" font-size="10" font-style="italic" fill="#9a3412">★ attrs copied from F  (setAttributes(F))</text>

  <!-- miss_entry -->
  <rect x="1030" y="456" width="520" height="80" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1290" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">miss_entry</text>
  <text x="1050" y="492" font-size="11" fill="#374151">alloca out_fn, out_bucket, dims</text>
  <text x="1050" y="508" font-size="11" fill="#374151">funcidx = load @__ejit_funcidx_F</text>
  <text x="1050" y="524" font-size="11" fill="#374151">br funcidx==invalid ? miss_fallback : miss_call</text>

  <!-- miss_call -->
  <rect x="1030" y="556" width="260" height="84" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1160" y="574" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">miss_call</text>
  <text x="1160" y="592" text-anchor="middle" font-size="10" fill="#374151">ejit_taskpool_</text>
  <text x="1160" y="606" text-anchor="middle" font-size="10" fill="#374151">compile_or_get_Nd</text>
  <text x="1160" y="620" text-anchor="middle" font-size="10" fill="#374151">→ status, out_fn</text>
  <text x="1160" y="634" text-anchor="middle" font-size="10" fill="#374151">br ok ? dispatch : fallback</text>

  <!-- miss_fallback -->
  <rect x="1320" y="556" width="230" height="100" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="1435" y="574" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">miss_fallback</text>
  <text x="1435" y="594" text-anchor="middle" font-size="11" fill="#374151">★ original body</text>
  <text x="1435" y="610" text-anchor="middle" font-size="10" fill="#6b7280">(all blocks moved from F)</text>
  <text x="1435" y="642" text-anchor="middle" font-size="11" fill="#374151">ret</text>

  <!-- miss_dispatch -->
  <rect x="1030" y="670" width="260" height="72" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1160" y="688" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">miss_dispatch</text>
  <text x="1160" y="708" text-anchor="middle" font-size="11" fill="#374151">call out_fn(args)  ← JIT spec</text>
  <text x="1160" y="724" text-anchor="middle" font-size="11" fill="#374151">release_read; ret</text>

  <!-- arrows in F_miss -->
  <line x1="1130" y1="536" x2="1150" y2="554" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="1095" y="552" font-size="10" font-weight="bold" fill="#16a34a">valid</text>
  <line x1="1435" y1="536" x2="1435" y2="554" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="1448" y="552" font-size="10" font-weight="bold" fill="#dc2626">invalid</text>
  <line x1="1160" y1="640" x2="1160" y2="668" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="1135" y="660" font-size="10" font-weight="bold" fill="#16a34a">ok</text>
  <line x1="1290" y1="598" x2="1318" y2="598" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="1296" y="592" font-size="10" font-weight="bold" fill="#dc2626">fail</text>
  <line x1="1160" y1="742" x2="1160" y2="776" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1170" y="766" font-size="10" fill="#374151">ret → caller</text>

  <!-- ============ icache OFF section ============ -->
  <text x="830" y="846" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">icache OFF  (contrast: single-function wrapper, body stays in F)</text>

  <rect x="420" y="860" width="820" height="308" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="830" y="882" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">F   (noinline · framed · body stays here)</text>

  <!-- jit_entry -->
  <rect x="440" y="898" width="780" height="66" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="830" y="916" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">jit_entry</text>
  <text x="460" y="934" font-size="11" fill="#374151">alloca; funcidx = load @__ejit_funcidx_F</text>
  <text x="460" y="950" font-size="11" fill="#374151">br funcidx==invalid ? jit_fallback : jit_call   (no icache probe)</text>

  <!-- jit_call -->
  <rect x="440" y="988" width="340" height="74" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="1006" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">jit_call</text>
  <text x="610" y="1024" text-anchor="middle" font-size="11" fill="#374151">ejit_taskpool_compile_or_get_Nd</text>
  <text x="610" y="1040" text-anchor="middle" font-size="11" fill="#374151">→ status, out_fn</text>
  <text x="610" y="1056" text-anchor="middle" font-size="10" fill="#374151">br ok ? jit_dispatch : jit_fallback</text>

  <!-- jit_fallback -->
  <rect x="820" y="988" width="400" height="74" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="1020" y="1006" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">jit_fallback</text>
  <text x="1020" y="1026" text-anchor="middle" font-size="11" fill="#374151">★ original body (in place)</text>
  <text x="1020" y="1050" text-anchor="middle" font-size="11" fill="#374151">ret</text>

  <!-- jit_dispatch -->
  <rect x="440" y="1086" width="340" height="66" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="1104" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">jit_dispatch</text>
  <text x="610" y="1124" text-anchor="middle" font-size="11" fill="#374151">call out_fn(args) ← JIT spec</text>
  <text x="610" y="1140" text-anchor="middle" font-size="11" fill="#374151">release_read; ret</text>

  <!-- arrows icache OFF -->
  <line x1="610" y1="964" x2="610" y2="986" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="580" y="980" font-size="10" font-weight="bold" fill="#16a34a">valid</text>
  <line x1="1020" y1="964" x2="1020" y2="986" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="1034" y="980" font-size="10" font-weight="bold" fill="#dc2626">invalid</text>
  <line x1="610" y1="1062" x2="610" y2="1084" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="580" y="1078" font-size="10" font-weight="bold" fill="#16a34a">ok</text>
  <line x1="780" y1="1025" x2="818" y2="1025" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="788" y="1019" font-size="10" font-weight="bold" fill="#dc2626">fail</text>
</svg>
